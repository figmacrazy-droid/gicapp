name: Build Android APK & Google Play AAB (Student App)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ALghad
        run: flutter pub get

      - name: Build Split APKs (Direct Install for Client)
        working-directory: ALghad
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build Google Play App Bundle (AAB)
        working-directory: ALghad
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Student App APKs (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: ALghad-Student-App-APKs
          path: ALghad/build/app/outputs/flutter-apk/*.apk

      - name: Upload Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ALghad-GooglePlay-AAB
          path: ALghad/build/app/outputs/bundle/release/*.aab
