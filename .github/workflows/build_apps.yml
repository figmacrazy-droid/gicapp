name: Build Android APK (Student App)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Student App)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ALghad
        run: flutter pub get

      - name: Build Split APKs (Optimized & Compressed)
        working-directory: ALghad
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Student App APKs
        uses: actions/upload-artifact@v4
        with:
          name: ALghad-Student-App-APKs
          path: ALghad/build/app/outputs/flutter-apk/*.apk
